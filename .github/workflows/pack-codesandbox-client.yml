name: 打包 LibreChat Sandpack 沙箱离线包

on:
  workflow_dispatch:

jobs:
  pack-codesandbox-client:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 生成内网部署编排文件
        run: |
          mkdir -p codesandbox-deploy
          cat << 'EOF' > codesandbox-deploy/docker-compose.yml
          services:
            sandpack-bundler:
              image: ghcr.io/librechat-ai/codesandbox-client/bundler:latest
              container_name: librechat-sandpack
              restart: unless-stopped
              ports:
                - "8080:80"
          EOF

      - name: 2. 拉取官方预构建镜像并压缩打包
        run: |
          docker pull ghcr.io/librechat-ai/codesandbox-client/bundler:latest
          docker save ghcr.io/librechat-ai/codesandbox-client/bundler:latest | gzip > codesandbox-bundler-image.tar.gz

      - name: 3. 上传离线包供下载
        uses: actions/upload-artifact@v4
        with:
          name: librechat-sandpack-offline-bundle
          path: |
            codesandbox-bundler-image.tar.gz
            codesandbox-deploy/
