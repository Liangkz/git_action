name: 打包 JoyAgent-JDGenie 离线包

on:
  workflow_dispatch:

jobs:
  pack-genie:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 克隆并修复 Dockerfile 与前端构建配置
        run: |
          git clone --depth 1 https://github.com/jd-opensource/joyagent-jdgenie.git
          cd joyagent-jdgenie
          # 修复1：锁定 Python 基础镜像为 Debian 12 (bookworm)，解决 apt 依赖冲突
          sed -i 's|python:3.11-slim|python:3.11-slim-bookworm|g' Dockerfile
          # 修复2：去掉国内 Docker 镜像加速前缀，避免海外服务器拉取限流
          sed -i 's|docker.m.daocloud.io/library/||g' Dockerfile
          # 修复3：锁定 pnpm 为 9.x，避开 pnpm v10 默认拦截 esbuild 构建脚本的问题
          sed -i 's|npm install -g pnpm|npm install -g pnpm@9|g' Dockerfile
          # 修复4：跳过构建前的严格 tsc 检查，避免上游代码残留未使用变量（TS6133）导致中断
          sed -i 's|tsc -b && ||g' ui/package.json

      - name: 2. 云端编译 Docker 镜像
        run: |
          cd joyagent-jdgenie
          docker build -t genie:latest .

      - name: 3. 导出并压缩离线镜像
        run: docker save genie:latest | gzip > genie-image.tar.gz

      - name: 4. 上传离线包供下载
        uses: actions/upload-artifact@v4
        with:
          name: joyagent-jdgenie-offline-bundle
          path: |
            genie-image.tar.gz
            joyagent-jdgenie/
