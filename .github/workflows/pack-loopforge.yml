name: 打包 LoopForge 离线包

on:
  workflow_dispatch:

jobs:
  pack-loopforge:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 克隆 LoopForge 仓库并初始化占位配置
        run: |
          git clone --depth 1 https://github.com/Tencent/LoopForge.git
          cd LoopForge
          cat << 'EOF' > .env.pull
          LOOPFORGE_DB_PASSWORD=placeholder_pass
          LOOPFORGE_DB_ROOT_PASSWORD=placeholder_root
          AGENTFLOW_SESSION_SECRET=placeholder_secret
          LOOPFORGE_DATA_DIR=/opt/loopforge-data
          EOF

      - name: 2. 拉取全部官方镜像并压缩打包
        run: |
          cd LoopForge
          # 必须指定 --profile platform，否则只会拉取 mysql 而跳过主平台镜像
          docker compose --env-file .env.pull --profile platform pull
          ALL_IMAGES=$(docker compose --env-file .env.pull --profile platform config --images | sort -u)
          echo "即将打包以下镜像："
          echo "$ALL_IMAGES"
          docker save $(echo "$ALL_IMAGES" | tr '\n' ' ') | gzip > ../loopforge-images.tar.gz
          rm -rf .env.pull .git

      - name: 3. 上传离线包供下载
        uses: actions/upload-artifact@v4
        with:
          name: loopforge-offline-bundle
          path: |
            loopforge-images.tar.gz
            LoopForge/
